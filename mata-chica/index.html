<style>
  :root{
    --bg:#F7F4EC;
    --surface:#FFFFFF;
    --surface-2:#F1ECDD;
    --header-bg:#122A52;
    --header-text:#F7F4EC;
    --nav-bg:#2C4E82;
    --nav-text:#F7F4EC;
    --nav-active-bg:rgba(0,0,0,.10);
    --accent:#A6192E;
    --accent-press:#8C1327;
    --accent-ink:#8C1327;
    --warn:#A9781F;
    --gold:#E7CDA0;
    --gold-ink:#122A52;
    --text:#1C2333;
    --text-muted:#6B6555;
    --border:#E1DCCB;
    --ok-bg:#E4EEE0;
    --ok-text:#2E6B3E;
    --err-bg:#F6DEDA;
    --err-text:#8C1327;
    --shadow:rgba(20,20,10,.16);
    --shadow-soft:rgba(20,20,10,.10);
    --dot-ok:#2E6B3E;
    --dot-warn:#A9781F;
    --dot-err:#A6192E;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0D1526;
      --surface:#16213C;
      --surface-2:#1C2A4A;
      --header-bg:#0A1120;
      --header-text:#F0EBDC;
      --nav-bg:#1C2E52;
      --nav-text:#F0EBDC;
      --nav-active-bg:rgba(255,255,255,.09);
      --accent:#D3576A;
      --accent-press:#B23C50;
      --accent-ink:#F2AAB6;
      --warn:#DCAE55;
      --gold:#7A5C2E;
      --gold-ink:#F2EEE0;
      --text:#EAE4D4;
      --text-muted:#A29B87;
      --border:#2B3B5E;
      --ok-bg:#15301F;
      --ok-text:#7ECB98;
      --err-bg:#3A1620;
      --err-text:#F2A6B2;
      --shadow:rgba(0,0,0,.55);
      --shadow-soft:rgba(0,0,0,.4);
      --dot-ok:#7ECB98;
      --dot-warn:#DCAE55;
      --dot-err:#E27C8D;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D1526;
    --surface:#16213C;
    --surface-2:#1C2A4A;
    --header-bg:#0A1120;
    --header-text:#F0EBDC;
    --nav-bg:#1C2E52;
    --nav-text:#F0EBDC;
    --nav-active-bg:rgba(255,255,255,.09);
    --accent:#D3576A;
    --accent-press:#B23C50;
    --accent-ink:#F2AAB6;
    --warn:#DCAE55;
    --gold:#7A5C2E;
    --gold-ink:#F2EEE0;
    --text:#EAE4D4;
    --text-muted:#A29B87;
    --border:#2B3B5E;
    --ok-bg:#15301F;
    --ok-text:#7ECB98;
    --err-bg:#3A1620;
    --err-text:#F2A6B2;
    --shadow:rgba(0,0,0,.55);
    --shadow-soft:rgba(0,0,0,.4);
    --dot-ok:#7ECB98;
    --dot-warn:#DCAE55;
    --dot-err:#E27C8D;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:40px;
  }
  header{
    background:var(--header-bg);
    color:var(--header-text);
    padding:16px 16px 14px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 8px var(--shadow);
  }
  .header-inner{display:flex;align-items:center;gap:12px;max-width:900px;margin:0 auto;}
  .crest{flex-shrink:0;}
  header h1{margin:0;font-size:1.3rem;letter-spacing:.09em;font-weight:700;font-family:Georgia,'Times New Roman',serif;}
  header .sub{font-size:.74rem;opacity:.85;letter-spacing:.03em;margin-top:2px;}
  header .sub2{font-size:.63rem;opacity:.6;text-transform:uppercase;letter-spacing:.09em;margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .sync-dot{width:6px;height:6px;border-radius:50%;background:var(--dot-warn);flex-shrink:0;}
  .sync-status.ok .sync-dot{background:var(--dot-ok);}
  .sync-status.err .sync-dot{background:var(--dot-err);}
  .sync-status{display:flex;align-items:center;gap:5px;}
  .stripe{
    height:5px;
    margin:14px -16px -14px -16px;
    background:linear-gradient(to right,#122A52 33.3%,#fff 33.3%,#fff 66.6%,#A6192E 66.6%);
  }
  nav{
    display:flex;
    overflow-x:auto;
    background:var(--nav-bg);
    position:sticky;
    top:56px;
    z-index:19;
    box-shadow:0 2px 6px var(--shadow-soft);
  }
  nav button{
    flex:1;
    min-width:84px;
    background:transparent;
    border:none;
    color:var(--nav-text);
    padding:11px 6px;
    font-size:.78rem;
    font-weight:600;
    cursor:pointer;
    border-bottom:3px solid transparent;
    white-space:nowrap;
    opacity:.75;
  }
  nav button.active{opacity:1;border-bottom:3px solid var(--accent);background:var(--nav-active-bg);}
  nav button:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }
  main{max-width:640px;margin:0 auto;padding:16px;}
  main.wide{max-width:900px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;}
  .prod-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:10px;text-align:left;}
  .prod-item:last-child{border-bottom:none;}
  .prod-name{font-weight:600;font-size:.94rem;}
  .prod-cat{font-size:.68rem;color:var(--nav-bg);color:color-mix(in srgb, var(--text-muted) 40%, var(--accent) 0%);color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
  .prod-qty{font-weight:700;font-size:1.05rem;min-width:78px;text-align:right;font-variant-numeric:tabular-nums;}
  .prod-qty.baixo{color:var(--warn);}
  .prod-qty.zerado{color:var(--accent);}
  .tag-baixo{font-size:.62rem;background:var(--warn);color:#fff;padding:1px 6px;border-radius:20px;margin-left:6px;vertical-align:middle;}
  .tag-zerado{font-size:.62rem;background:var(--accent);color:#fff;padding:1px 6px;border-radius:20px;margin-left:6px;vertical-align:middle;}
  .section-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);font-weight:700;margin:18px 0 6px;text-align:left;}
  .section-title:first-child{margin-top:0;}
  label{display:block;font-size:.75rem;font-weight:600;color:var(--text-muted);margin:10px 0 4px;text-align:left;}
  input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:7px;font-size:.9rem;font-family:inherit;background:var(--surface);color:var(--text);}
  textarea{resize:vertical;min-height:52px;}
  .row2{display:flex;gap:10px;}
  .row2 > div{flex:1;}
  button.primary{margin-top:14px;width:100%;background:var(--accent);color:#fff;border:none;padding:11px;border-radius:7px;font-size:.92rem;font-weight:700;cursor:pointer;letter-spacing:.02em;}
  button.primary:active{background:var(--accent-press);}
  button.primary.danger{background:var(--accent-press);}
  button.secondary{background:none;border:1px solid var(--nav-bg);color:var(--nav-bg);padding:7px 10px;border-radius:7px;font-size:.8rem;font-weight:600;cursor:pointer;}
  :root[data-theme="dark"] button.secondary, @media (prefers-color-scheme:dark){ button.secondary{color:var(--text);border-color:var(--border);} }
  button.report-btn{background:var(--header-bg);color:#fff;border:none;padding:9px 12px;border-radius:7px;font-size:.8rem;font-weight:600;cursor:pointer;margin-top:4px;}
  button.link{background:none;border:none;color:var(--accent-ink);font-size:.78rem;font-weight:600;cursor:pointer;padding:4px;}
  .del-btn{background:none;border:none;color:var(--accent-ink);font-size:.95rem;cursor:pointer;padding:2px 6px;line-height:1;}
  .item-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--border);}
  .item-row select{flex:2;}
  .item-row input{flex:1;}
  .toggle-tabs{display:flex;gap:8px;margin-bottom:10px;}
  .toggle-tabs button{flex:1;padding:8px;border-radius:7px;border:1px solid var(--nav-bg);background:var(--surface);color:var(--nav-bg);font-weight:600;font-size:.82rem;cursor:pointer;}
  .toggle-tabs button.active{background:var(--nav-bg);color:#fff;}
  .hist-item{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border);font-size:.84rem;text-align:left;gap:8px;}
  .hist-item:last-child{border-bottom:none;}
  .hist-top{display:flex;justify-content:space-between;font-weight:600;gap:8px;}
  .hist-entrada{color:var(--ok-text);}
  .hist-saida{color:var(--accent-ink);}
  .hist-meta{color:var(--text-muted);font-size:.75rem;margin-top:2px;}
  .empty{text-align:center;color:var(--text-muted);font-size:.85rem;padding:24px 10px;}
  .manejo-card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:8px;padding:0;margin-bottom:10px;overflow:hidden;}
  .manejo-btn{width:100%;text-align:left;background:none;border:none;padding:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--text);}
  .manejo-head{display:flex;flex-direction:column;gap:2px;}
  .manejo-local{font-weight:700;font-size:.9rem;}
  .manejo-date{font-size:.72rem;color:var(--nav-bg);}
  :root[data-theme="dark"] .manejo-date{color:var(--warn);}
  @media (prefers-color-scheme:dark){ .manejo-date{color:var(--warn);} }
  .manejo-body{padding:0 12px 12px;}
  .manejo-desc{font-size:.85rem;margin:0 0 6px;color:var(--text);text-align:left;}
  .manejo-itens{font-size:.78rem;color:var(--text-muted);text-align:left;}
  .manejo-itens span{display:block;padding:1px 0;}
  .manejo-top-row{display:flex;align-items:center;gap:6px;}
  .badge-count{background:var(--gold);color:var(--gold-ink);font-size:.68rem;padding:2px 7px;border-radius:20px;font-weight:700;white-space:nowrap;}
  .filter-chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;}
  .filter-chips button{white-space:nowrap;padding:6px 12px;border-radius:20px;border:1px solid var(--nav-bg);background:var(--surface);color:var(--nav-bg);font-size:.76rem;font-weight:600;cursor:pointer;}
  .filter-chips button.active{background:var(--nav-bg);color:#fff;}
  .loading,.conn-msg{text-align:center;padding:40px 16px;color:var(--text-muted);}
  .conn-msg .conn-title{font-weight:700;color:var(--text);margin-bottom:6px;font-size:1rem;}
  .spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);margin:0 auto 14px;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){ .spinner{animation-duration:2.4s;} }

  .estoque-layout{display:flex;gap:16px;align-items:flex-start;}
  .estoque-list{flex:1;min-width:0;}
  .estoque-side{width:230px;flex-shrink:0;display:flex;flex-direction:column;gap:10px;}
  @media (max-width:680px){
    .estoque-layout{flex-direction:column;}
    .estoque-side{width:100%;flex-direction:row;}
  }
  .alert-box{
    border-radius:10px;
    padding:14px;
    cursor:pointer;
    color:#fff;
    border:none;
    text-align:left;
    flex:1;
  }
  .alert-box.baixo{background:var(--warn);}
  .alert-box.zerado{background:var(--accent);}
  .alert-box .num{font-size:1.6rem;font-weight:800;display:block;font-variant-numeric:tabular-nums;}
  .alert-box .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;opacity:.92;}
  .drawer{margin-top:12px;}
  .drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .drawer-title{font-weight:700;font-size:.85rem;}

  .search-row{display:flex;gap:8px;margin-bottom:12px;}
  .search-row input{flex:1;}

  input[type="checkbox"]{width:auto;accent-color:var(--accent);flex-shrink:0;}
  .rel-row{cursor:pointer;}
  .rel-row:hover{background:var(--surface-2);margin:0 -8px;padding:10px 8px;border-radius:6px;}
  .rel-left{display:flex;align-items:center;gap:10px;}
  .rel-bar{position:sticky;bottom:12px;z-index:5;}
  .rel-bar-row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .rel-bar-row button.primary{margin-top:0;width:auto;padding:10px 18px;}
  .rel-pedido-qtd{width:100px;flex-shrink:0;}

  .prod-item.clickable{cursor:pointer;}
  .prod-item.clickable:hover{background:var(--surface-2);margin:0 -8px;padding:10px 8px;border-radius:6px;}
  .back-link{background:none;border:none;color:var(--nav-bg);font-size:.8rem;font-weight:700;cursor:pointer;padding:4px 0;margin-bottom:10px;}
  :root[data-theme="dark"] .back-link{color:var(--text);}
  @media (prefers-color-scheme:dark){ .back-link{color:var(--text);} }
  .detail-heading{margin:2px 0 4px;font-size:1.15rem;font-family:Georgia,'Times New Roman',serif;}

  .backup-bar{
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
    padding:8px 16px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
  }
  .backup-btn{
    background:none;
    border:1px solid var(--border);
    color:var(--nav-bg);
    padding:6px 12px;
    border-radius:20px;
    font-size:.74rem;
    font-weight:600;
    cursor:pointer;
  }
  :root[data-theme="dark"] .backup-btn{color:var(--text);}
  @media (prefers-color-scheme:dark){ .backup-btn{color:var(--text);} }
  .backup-btn:hover{background:var(--surface-2);}
  .auth-email{font-size:.78rem;color:var(--text-muted);align-self:center;}

  .login-wrap{display:flex;justify-content:center;padding:36px 16px;}
  .login-card{max-width:360px;width:100%;}
  .login-title{font-family:Georgia,'Times New Roman',serif;font-size:1.2rem;margin:0 0 4px;}
  .login-sub{color:var(--text-muted);font-size:.85rem;margin:0 0 18px;}
  .login-error{background:var(--err-bg);color:var(--err-text);border-radius:7px;padding:8px 10px;font-size:.82rem;margin-bottom:12px;}
  .login-hint{color:var(--text-muted);font-size:.74rem;margin-top:6px;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(10,14,25,.55);
    display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:100;
  }
  .modal-box{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:20px;max-width:380px;width:100%;box-shadow:0 12px 32px var(--shadow);
  }
  .modal-msg{margin:0 0 16px;font-size:.9rem;color:var(--text);line-height:1.45;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;}
  .modal-actions button{width:auto;margin-top:0;padding:8px 16px;}

  .toast-wrap{position:fixed;left:0;right:0;bottom:18px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:200;pointer-events:none;}
  .toast{
    max-width:90vw;padding:10px 16px;border-radius:8px;font-size:.84rem;font-weight:600;
    box-shadow:0 6px 18px var(--shadow);opacity:0;transform:translateY(8px);
    transition:opacity .2s ease, transform .2s ease;
  }
  @media (prefers-reduced-motion:reduce){ .toast{transition:none;} }
  .toast.show{opacity:1;transform:translateY(0);}
  .toast.ok{background:var(--ok-bg);color:var(--ok-text);}
  .toast.err{background:var(--err-bg);color:var(--err-text);}

  .pdf-spinner{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;margin-right:7px;vertical-align:-2px;animation:spin .8s linear infinite;}

  /* ---- Início: campos desenhados ---- */
  .ini-topo{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 6px;}
  .ini-nota{font-size:.82rem;color:var(--text-muted);margin-bottom:12px;}
  .ano-sel{width:auto;padding:6px 10px;}
  .campo-grid{display:grid;grid-template-columns:1fr;gap:16px;}
  @media (min-width:820px){ .campo-grid{grid-template-columns:1fr 1fr;} }
  .campo{position:relative;min-height:270px;border-radius:10px;border:4px solid #fff;cursor:pointer;overflow:hidden;
    box-shadow:0 0 0 2px #2E6B3E,0 4px 14px var(--shadow);
    background:repeating-linear-gradient(90deg,#3E7F3C 0 34px,#468A43 34px 68px);display:flex;align-items:center;justify-content:center;padding:26px 30px;}
  .campo-linha.campo-meio{position:absolute;top:0;bottom:0;left:50%;width:3px;background:rgba(255,255,255,.85);}
  .campo-circ{position:absolute;top:50%;left:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border:3px solid rgba(255,255,255,.85);border-radius:50%;}
  .campo-gol{position:absolute;top:50%;width:12px;height:70px;margin-top:-35px;background:rgba(255,255,255,.9);border-radius:3px;}
  .campo-gol.esq{left:0;} .campo-gol.dir{right:0;}
  .campo-painel{position:relative;z-index:2;width:100%;max-width:330px;background:rgba(18,42,82,.88);color:#F7F4EC;border-radius:12px;padding:12px 14px;}
  .campo-nome{font-family:Georgia,'Times New Roman',serif;font-size:1.25rem;font-weight:700;letter-spacing:.03em;margin-bottom:6px;border-bottom:2px solid var(--accent);padding-bottom:4px;}
  .campo-areia{display:flex;justify-content:space-between;align-items:baseline;font-size:.92rem;}
  .campo-areia b{font-size:1.15rem;color:var(--gold);}
  .campo-bar{height:8px;background:rgba(255,255,255,.2);border-radius:5px;overflow:hidden;margin:4px 0 2px;}
  .campo-bar i{display:block;height:100%;background:var(--gold);}
  .campo-meta{font-size:.72rem;opacity:.75;margin-bottom:8px;}
  .campo-chips{display:flex;flex-wrap:wrap;gap:5px;}
  .chip-man{font-size:.74rem;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.14);color:#F7F4EC;}
  .chip-man.on{background:var(--gold);color:var(--gold-ink);font-weight:700;}
  .card .chip-man{background:var(--surface-2);color:var(--text-muted);} .card .chip-man.on{background:var(--gold);color:var(--gold-ink);}
  .campo-prods{margin-top:8px;border-top:1px solid rgba(255,255,255,.25);padding-top:6px;}
  .linha-prod{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;padding:2px 0;}
  .campo-ver{font-size:.72rem;opacity:.7;margin-top:8px;text-align:right;}
  .tag-tipo{background:var(--surface-2);border-radius:6px;padding:1px 7px;font-size:.78rem;font-weight:600;color:var(--header-bg);}
  .card-acoes{display:flex;gap:8px;margin-top:10px;}
  .acao-btn{flex:1;padding:9px 8px;border-radius:8px;border:1px solid var(--header-bg);background:var(--surface);color:var(--header-bg);font:inherit;font-size:.9rem;font-weight:600;cursor:pointer;}
  .acao-btn.perigo{border-color:var(--accent);color:var(--accent);}

  /* ---- Formulário de manejo simples ---- */
  .passo{font-weight:700;margin:18px 0 8px;font-size:1rem;color:var(--header-bg);}
  .passo .num{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--header-bg);color:#fff;font-size:.85rem;align-items:center;justify-content:center;margin-right:6px;}
  .passo .opc{font-weight:400;font-size:.8rem;color:var(--text-muted);}
  .chips-grande{display:flex;flex-wrap:wrap;gap:8px;}
  .chips-grande button{padding:12px 16px;border-radius:10px;border:2px solid var(--header-bg);background:var(--surface);color:var(--header-bg);font:inherit;font-weight:600;cursor:pointer;}
  .chips-grande button.on{background:var(--header-bg);color:#fff;}
  .item-row2{display:flex;gap:8px;align-items:center;margin-bottom:8px;}

<script>

};

let fsDb = null;

function uid(prefix){ return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){
  return String(s===undefined||s===null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function dataReady(){ return loadedProducts && loadedMovements && loadedManejos && loadedAudit; }

// ---------- FIREBASE / AUTH / DB SYNC ----------
function initApp(){
  if(!window.firebase || !window.firebase.initializeApp){
    dbState = 'unavailable';
    authState = 'unavailable';
    render();
    return;
  }
  try{
    firebase.initializeApp(firebaseConfig);
    fsDb = firebase.firestore();
    // A persistência é decidida na hora do login, pelo checkbox "Manter conectado".
  }catch(e){
    console.error('Erro ao iniciar Firebase', e);
    dbState = 'unavailable';
    authState = 'unavailable';
    render();
    return;
  }
  dbState = 'ready';

  firebase.auth().onAuthStateChanged(user=>{
    authUser = user;
    if(user){
      authState = 'loggedIn';
      authError = '';
      if(!firestoreListenersAttached){
        attachFirestoreListeners();
        firestoreListenersAttached = true;
      }
    } else {
      authState = 'loggedOut';
    }
    render();
  }, err=>{
    console.error('auth state error', err);
    authState = 'unavailable';
    render();
  });
}

function attachFirestoreListeners(){
  fsDb.collection('products').onSnapshot(snap=>{
    data.products = snap.docs.map(d=>({id:d.id, ...d.data()}));
    loadedProducts = true;
    render();
  }, err=>{ console.error('products snapshot', err); showToast('Erro ao sincronizar produtos.', 'err'); });

  fsDb.collection('movements').onSnapshot(snap=>{
    data.movements = snap.docs.map(d=>({id:d.id, ...d.data()}));
    loadedMovements = true;
    render();
  }, err=>{ console.error('movements snapshot', err); showToast('Erro ao sincronizar movimentações.', 'err'); });

  fsDb.collection('manejos').onSnapshot(snap=>{
    data.manejos = snap.docs.map(d=>({id:d.id, ...d.data()}));
    loadedManejos = true;
    render();
  }, err=>{ console.error('manejos snapshot', err); showToast('Erro ao sincronizar manejos.', 'err'); });

  fsDb.collection('audit').onSnapshot(snap=>{
    data.audit = snap.docs.map(d=>({id:d.id, ...d.data()}));
    loadedAudit = true;
    render();
  }, err=>{ console.error('audit snapshot', err); loadedAudit = true; render(); });
}

async function logAudit(acao, detalhes){
  if(!fsDb) return;
  const entry = {
    date: new Date().toISOString(),
    userEmail: (authUser && authUser.email) || '(desconhecido)',
    acao,
    detalhes: detalhes || ''
  };
  try{ await fsDb.collection('audit').doc(uid('aud')).set(entry); }
  catch(e){ console.error('Erro ao registrar auditoria', e); }
}

async function doLogin(email, senha, lembrar){
  authError = '';
  authBusy = true;
  render();
  try{
    await firebase.auth().setPersistence(lembrar ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.NONE);
    await firebase.auth().signInWithEmailAndPassword(email, senha);
    // onAuthStateChanged cuida do resto
  }catch(e){
    console.error('login error', e.code, e.message);
    const map = {
      'auth/invalid-email': 'E-mail inválido.',
      'auth/user-disabled': 'Este usuário foi desativado.',
      'auth/user-not-found': 'E-mail ou senha incorretos.',
      'auth/wrong-password': 'E-mail ou senha incorretos.',
      'auth/invalid-credential': 'E-mail ou senha incorretos.',
      'auth/too-many-requests': 'Muitas tentativas. Aguarde um pouco e tente de novo.',
      'auth/network-request-failed': 'Sem conexão com a internet.'
    };
    authError = map[e.code] || 'Não foi possível entrar. Tente novamente.';
  }
  authBusy = false;
  render();
}

async function doLogout(){
  try{ await firebase.auth().signOut(); }
  catch(e){ console.error('logout error', e); }
}

async function persistProduct(p){
  if(!fsDb) return;
  const {id, ...body} = p;
  try{ await fsDb.collection('products').doc(id).set(body); }
  catch(e){ console.error('Erro ao salvar produto', e); showToast('Não foi possível salvar o produto.', 'err'); }
}
async function persistMovement(m){
  if(!fsDb) return;
  const {id, ...body} = m;
  try{ await fsDb.collection('movements').doc(id).set(body); }
  catch(e){ console.error('Erro ao salvar movimentação', e); showToast('Não foi possível salvar a movimentação.', 'err'); }
}
async function persistManejo(mj){
  if(!fsDb) return;
  const {id, ...body} = mj;
  try{ await fsDb.collection('manejos').doc(id).set(body); }
  catch(e){ console.error('Erro ao salvar manejo', e); showToast('Não foi possível salvar o manejo.', 'err'); }
}
async function deleteProductRemote(id){
  if(!fsDb) return;
  try{ await fsDb.collection('products').doc(id).delete(); }catch(e){ console.error(e); }
}
async function deleteMovementRemote(id){
  if(!fsDb) return;
  try{ await fsDb.collection('movements').doc(id).delete(); }catch(e){ console.error(e); }
}
async function deleteManejoRemote(id){
  if(!fsDb) return;
  try{ await fsDb.collection('manejos').doc(id).delete(); }catch(e){ console.error(e); }
}

function categorias(){
  const set = new Set(data.products.map(p=>p.category));
  return ['Todas', ...set];
}
function findProduct(id){ return data.products.find(p=>p.id===id); }
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function fmtDateOnly(iso){ return new Date(iso).toLocaleDateString('pt-BR'); }

const TABS = [
  {id:'inicio', label:'Início'},
  {id:'estoque', label:'Estoque'},
  {id:'manejos', label:'Manejos'},
  {id:'movimentacao', label:'Movimentação Geral'},
  {id:'historico', label:'Histórico'},
  {id:'relatorios', label:'Relatórios'},
  {id:'auditoria', label:'Auditoria'},
];

function renderNav(){
  const nav = document.getElementById('nav');
  if(authState!=='loggedIn'){ nav.innerHTML = ''; return; }
  nav.innerHTML = TABS.map(t=>
    `<button data-tab="${t.id}" class="${currentTab===t.id?'active':''}">${t.label}</button>`
  ).join('');
  nav.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{ currentTab = b.dataset.tab; campoSel = null; if(currentTab!=='estoque'){ estoqueDrawer=null; selectedProductId=null; estoqueMostrarEntrada=false; } render(); };
  });
}

function renderSyncStatus(){
  const el = document.getElementById('sync-status');
  const txt = document.getElementById('sync-text');
  if(!el) return;
  if(authState!=='loggedIn'){ el.style.display = 'none'; return; }
  el.style.display = '';
  el.className = 'sync-status';
  if(dbState==='unavailable'){ el.classList.add('err'); txt.textContent = 'Sem conexão'; }
  else if(dbState==='ready' && dataReady()){ el.classList.add('ok'); txt.textContent = 'Sincronizado'; }
  else { txt.textContent = 'Conectando…'; }
}

function renderChromeBars(){
  const authBar = document.getElementById('auth-bar');
  const backupBar = document.getElementById('backup-bar');
  if(authState==='loggedIn'){
    authBar.style.display = '';
    backupBar.style.display = '';
    const emailEl = document.getElementById('auth-email');
    if(emailEl) emailEl.textContent = authUser && authUser.email ? authUser.email : '';
    const logoutBtn = document.getElementById('btn-logout');
    if(logoutBtn) logoutBtn.onclick = doLogout;
  } else {
    authBar.style.display = 'none';
    backupBar.style.display = 'none';
  }
}

function renderLogin(){
  return `
  <div class="login-wrap">
    <div class="card login-card">
      <div class="login-title">Entrar</div>
      <div class="login-sub">Acesso restrito — Mata Chica Polo Club</div>
      ${authError ? `<div class="login-error">${esc(authError)}</div>` : ''}
      <label>E-mail</label>
      <input id="login-email" type="email" autocomplete="username" placeholder="seuemail@exemplo.com" value="${esc(loginEmail)}" ${authBusy?'disabled':''}>
      <label>Senha</label>
      <input id="login-senha" type="password" autocomplete="current-password" placeholder="Sua senha" ${authBusy?'disabled':''}>
      <label style="display:flex;align-items:center;gap:8px;font-weight:400;margin-top:12px;">
        <input type="checkbox" id="login-lembrar" style="width:auto;" ${loginLembrar?'checked':''} ${authBusy?'disabled':''}>
        <span>Manter conectado neste aparelho</span>
      </label>
      <div class="login-hint">Só marque em aparelho pessoal. Sem marcar, sempre vai pedir e-mail e senha de novo.</div>
      <button class="primary" id="btn-login" ${authBusy?'disabled':''} style="margin-top:14px;">${authBusy?'Entrando...':'Entrar'}</button>
    </div>
  </div>`;
}

function attachLoginHandlers(){
  const emailEl = document.getElementById('login-email');
  if(emailEl) emailEl.oninput = ()=>{ loginEmail = emailEl.value; };
  const lembrarEl = document.getElementById('login-lembrar');
  if(lembrarEl) lembrarEl.onchange = ()=>{ loginLembrar = lembrarEl.checked; };

  const form = ()=>{
    const email = document.getElementById('login-email').value.trim();
    const senha = document.getElementById('login-senha').value;
    const lembrar = document.getElementById('login-lembrar').checked;
    loginEmail = email;
    loginLembrar = lembrar;
    if(!email || !senha){ authError = 'Preencha e-mail e senha.'; render(); return; }
    doLogin(email, senha, lembrar);
  };
  const btn = document.getElementById('btn-login');
  if(btn) btn.onclick = form;
  const senhaEl = document.getElementById('login-senha');
  if(senhaEl) senhaEl.onkeydown = (e)=>{ if(e.key==='Enter') form(); };
  if(emailEl) emailEl.onkeydown = (e)=>{ if(e.key==='Enter') form(); };
}

function render(){
  const main0 = document.getElementById('main');
  const active = document.activeElement;
  let restoreId = null, restoreStart = null, restoreEnd = null;
  if(active && (active.tagName==='INPUT'||active.tagName==='TEXTAREA') && active.id && main0 && main0.contains(active)){
    restoreId = active.id;
    try{ restoreStart = active.selectionStart; restoreEnd = active.selectionEnd; }catch(e){}
  }

  renderNav();
  renderSyncStatus();
  renderChromeBars();
  const main = document.getElementById('main');

  if(dbState==='unavailable' || authState==='unavailable'){
    main.className = '';
    main.innerHTML = `<div class="conn-msg">
      <div class="conn-title">Sem conexão com o estoque compartilhado</div>
      <div>Não foi possível carregar o banco de dados. Verifique sua internet e recarregue a página.</div>
    </div>`;
    return;
  }
  if(authState==='loading'){
    main.className = '';
    main.innerHTML = `<div class="loading"><div class="spinner"></div>Conectando...</div>`;
    return;
  }
  if(authState==='loggedOut'){
    main.className = '';
    main.innerHTML = renderLogin();
    attachLoginHandlers();
    if(restoreId){
      const el = document.getElementById(restoreId);
      if(el){
        el.focus();
        if(typeof restoreStart==='number' && el.setSelectionRange){
          try{ el.setSelectionRange(restoreStart, restoreEnd); }catch(e){}
        }
      }
    }
    return;
  }
  if(!dataReady()){
    main.className = '';
    main.innerHTML = `<div class="loading"><div class="spinner"></div>Carregando estoque...</div>`;
    return;
  }

  main.className = (currentTab==='inicio' || currentTab==='estoque' || currentTab==='relatorios') ? 'wide' : '';
  if(currentTab==='inicio') main.innerHTML = renderInicio();
  else if(currentTab==='estoque') main.innerHTML = renderEstoque();
  else if(currentTab==='manejos') main.innerHTML = renderManejos();
  else if(currentTab==='movimentacao') main.innerHTML = renderMovimentacao();
  else if(currentTab==='historico') main.innerHTML = renderHistorico();
  else if(currentTab==='relatorios') main.innerHTML = renderRelatorios();
  else if(currentTab==='auditoria') main.innerHTML = renderAuditoria();
  attachHandlers();

  if(restoreId){
    const el = document.getElementById(restoreId);
    if(el){
      el.focus();
      if(typeof restoreStart==='number' && el.setSelectionRange){
        try{ el.setSelectionRange(restoreStart, restoreEnd); }catch(e){}
      }
    }
  }
}

// ---------- ESTOQUE ----------
function renderEstoque(){
  if(estoqueMostrarEntrada){
    return `<button class="back-link" id="btn-entrada-voltar">← Voltar ao estoque</button>` + renderEntrada();
  }
  if(selectedProductId){
    const p = findProduct(selectedProductId);
    if(p) return renderProductDetail(p);
    selectedProductId = null;
  }
  const cats = categorias();
  const chips = cats.map(c=>`<button data-cat="${esc(c)}" class="${filtroCategoria===c?'active':''}">${esc(c)}</button>`).join('');
  const termo = estoqueBusca.trim().toLowerCase();
  const list = data.products
    .filter(p=> filtroCategoria==='Todas' || p.category===filtroCategoria)
    .filter(p=> !termo || p.name.toLowerCase().includes(termo))
    .sort((a,b)=>a.name.localeCompare(b.name));

  const grouped = {};
  list.forEach(p=>{ (grouped[p.category] = grouped[p.category]||[]).push(p); });

  let listHtml = `<button class="primary" id="btn-entrada-abrir" style="margin-bottom:12px;">+ Registrar entrada</button>`;
  listHtml += `<div class="search-row"><input id="est-busca" type="text" placeholder="Buscar produto..." value="${esc(estoqueBusca)}"></div>`;
  listHtml += `<div class="filter-chips">${chips}</div>`;
  if(list.length===0){
    listHtml += `<div class="empty">Nenhum produto encontrado.</div>`;
  }
  for(const cat in grouped){
    listHtml += `<div class="section-title">${esc(cat)}</div><div class="card">`;
    listHtml += grouped[cat].map(p=>{
      const zerado = p.qty<=0;
      const baixo = !zerado && p.qty <= p.min;
      const cls = zerado?'zerado':(baixo?'baixo':'');
      const tag = zerado?'<span class="tag-zerado">zerado</span>':(baixo?'<span class="tag-baixo">baixo</span>':'');
      return `<div class="prod-item clickable" data-open="${esc(p.id)}">
        <div>
          <div class="prod-name">${esc(p.name)} ${tag}</div>
          <div class="prod-cat">mín. ${esc(p.min)} ${esc(p.unit)}</div>
        </div>
        <div class="prod-qty ${cls}">${esc(p.qty)} ${esc(p.unit)}</div>
      </div>`;
    }).join('');
    listHtml += `</div>`;
  }
  listHtml += `<button class="report-btn" id="btn-report-estoque">Gerar relatório de estoque (PDF)</button>`;

  const baixoItems = data.products.filter(p=>p.qty>0 && p.qty<=p.min);
  const zeradoItems = data.products.filter(p=>p.qty<=0);

  let drawerHtml = '';
  if(estoqueDrawer){
    const items = estoqueDrawer==='baixo' ? baixoItems : zeradoItems;
    const grp = {};
    items.forEach(p=>{ (grp[p.category]=grp[p.category]||[]).push(p); });
    let body = '';
    if(items.length===0){
      body = `<div class="empty">Nenhum item nesta condição.</div>`;
    }else{
      for(const cat in grp){
        body += `<div class="prod-cat" style="margin:8px 0 4px;">${esc(cat)}</div>`;
        body += grp[cat].map(p=>`<div class="prod-item clickable" data-open="${esc(p.id)}"><div class="prod-name">${esc(p.name)}</div><div class="prod-qty">${esc(p.qty)} ${esc(p.unit)}</div></div>`).join('');
      }
    }
    drawerHtml = `<div class="card drawer">
      <div class="drawer-head">
        <div class="drawer-title">${estoqueDrawer==='baixo' ? 'Estoque baixo — todas as categorias' : 'Estoque zerado — todas as categorias'}</div>
        <button class="link" id="btn-drawer-close">Fechar ✕</button>
      </div>
      ${body}
    </div>`;
  }

  return `
  <div class="estoque-layout">
    <div class="estoque-list">${listHtml}</div>
    <div class="estoque-side">
      <button class="alert-box baixo" id="box-baixo">
        <span class="num">${baixoItems.length}</span>
        <span class="lbl">Estoque baixo</span>
      </button>
      <button class="alert-box zerado" id="box-zerado">
        <span class="num">${zeradoItems.length}</span>
        <span class="lbl">Estoque zerado</span>
      </button>
    </div>
  </div>
  ${drawerHtml}
  `;
}

function renderProductDetail(p){
  const moves = data.movements
    .filter(m=>m.productId===p.id)
    .sort((a,b)=> new Date(b.date) - new Date(a.date))
    .slice(0,10);

  let movHtml = `<div class="empty">Sem movimentações registradas para este produto.</div>`;
  if(moves.length){
    movHtml = moves.map(m=>{
      const cls = m.type==='entrada' ? 'hist-entrada' : 'hist-saida';
      const sign = m.type==='entrada' ? '+' : '−';
      return `<div class="hist-item">
        <div>
          <div class="hist-top"><span>${fmtDate(m.date)}</span><span class="${cls}">${sign} ${esc(m.qty)} ${esc(p.unit)}</span></div>
          <div class="hist-meta">${esc(m.reason||'')}</div>
        </div>
      </div>`;
    }).join('');
  }

  return `
  <button class="back-link" id="btn-back-produto">← Voltar ao estoque</button>
  <div class="card">
    <div class="section-title">${esc(p.category)}</div>
    <div class="detail-heading">${esc(p.name)}</div>

    <label>Nome</label>

// ---------- INÍCIO (campos desenhados) ----------
const TIPOS_CAMPO = ['Roçada','Irrigação','Roçadeira vertical','Areia','Herbicida','Adubação','Outro'];
const TIPOS_IMPL = ['Manutenção preventiva','Conserto'];
const TIPOS_INICIO = ['Areia','Roçadeira vertical','Herbicida','Adubação'];
const CAMPOS_INICIO = ['Campo 1','Campo 2','Campo 3','Campo 4'];
const META_AREIA = 500;

function brl(v){ return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fmtQ(v){ return (Math.round((v||0)*100)/100).toLocaleString('pt-BR'); }

// Manejos antigos não têm "tipo de manejo": descobrimos pelo texto e pelos produtos.
function tipoManejo(m){
  if(m.categoria) return m.categoria;
  if(m.tipo==='implemento') return 'Manutenção preventiva';
  const prods = (m.itens||[]).map(it=>{ const p=findProduct(it.productId); return p ? (p.name+' '+p.category) : ''; }).join(' ');
  const t = ((m.descricao||'')+' '+prods).toLowerCase();
  if(/areia/.test(t)) return 'Areia';
  if(/vertical/.test(t)) return 'Roçadeira vertical';
  if(/herbicida|glifosato|roundup|2,4|capim/.test(t)) return 'Herbicida';
  if(/adub|npk|ureia|ureía|calc[aá]rio|fertiliz/.test(t)) return 'Adubação';
  if(/irrig/.test(t)) return 'Irrigação';
  if(/ro[cç]ad|ro[cç]ar|corte/.test(t)) return 'Roçada';
  if(/insumo/.test(t)) return 'Herbicida';
  return 'Outro';
}

function custoManejo(m){
  const itens = (m.itens||[]).reduce((a,it)=>{
    const p = findProduct(it.productId);
    const v = (it.valor!==undefined && it.valor!==null) ? it.valor : ((p&&p.valor)||0);
    return a + (it.qty||0)*v;
  },0);
  return itens + (m.extra||0);
}

function manejosDoCampo(local, ano){
  return data.manejos
    .filter(m=> (m.tipo||'campo')!=='implemento' && m.local===local
      && new Date(m.date).getFullYear()===ano && TIPOS_INICIO.includes(tipoManejo(m)))
    .sort((a,b)=> new Date(b.date) - new Date(a.date));
}

function resumoCampo(local, ano){
  const list = manejosDoCampo(local, ano);
  const cont = {}; TIPOS_INICIO.forEach(t=>cont[t]=0);
  const prods = {};
  let areia = 0, custo = 0;
  list.forEach(m=>{
    cont[tipoManejo(m)]++;
    custo += custoManejo(m);
    (m.itens||[]).forEach(it=>{
      const p = findProduct(it.productId);
      const nome = p ? p.name : '(produto removido)';
      const un = p ? p.unit : '';
      const k = it.productId;
      if(!prods[k]) prods[k] = {nome, un, qty:0, areia: /areia/i.test(nome)};
      prods[k].qty += it.qty||0;
      if(prods[k].areia) areia += it.qty||0;
    });
  });
  return { list, cont, prods: Object.values(prods).sort((a,b)=>a.nome.localeCompare(b.nome)), areia, custo };
}

function cardManejo(m){
  const itens = (m.itens||[]).map(it=>{
    const p = findProduct(it.productId);
    return `<span>• ${p?esc(p.name):'(produto removido)'} — ${esc(fmtQ(it.qty))} ${p?esc(p.unit):''}</span>`;
  }).join('<br>');
  const c = custoManejo(m);
  return `<div class="card" style="margin-bottom:10px;">
    <div class="hist-top">
      <span style="font-weight:700;">${fmtDateOnly(m.date)} · <span class="tag-tipo">${esc(tipoManejo(m))}</span></span>
      <span style="font-weight:600;">${c>0?brl(c):''}</span>
    </div>
    ${m.tipo==='implemento'||true ? `<div class="manejo-desc" style="color:var(--text-muted);font-size:.85rem;">${esc(m.local||'')}${m.carrinho?' · <b>'+esc(m.carrinho)+'</b>':''}</div>`:''}
    <div class="manejo-desc">${esc(m.descricao) || ''}</div>
    <div class="manejo-itens" style="margin-top:6px;">${itens || '<span style="color:var(--text-muted)">(sem produtos utilizados)</span>'}</div>
    <div class="card-acoes">
      <button type="button" class="acao-btn" data-editmanejo="${esc(m.id)}">✎ Alterar</button>
      <button type="button" class="acao-btn perigo" data-delmanejo="${esc(m.id)}">🗑 Excluir</button>
    </div>
  </div>`;
}

function attachManejoCardHandlers(){

function renderInicio(){
  if(campoSel) return renderCampoDetalhe(campoSel);
  const campos = CAMPOS_INICIO.map(c=>{
    const r = resumoCampo(c, anoSel);
    const pct = Math.min(100, r.areia/META_AREIA*100);
    const chips = TIPOS_INICIO.map(t=>`<span class="chip-man${r.cont[t]?' on':''}">${t==='Roçadeira vertical'?'Vertical':t} ${r.cont[t]}×</span>`).join('');
    const outros = r.prods.filter(p=>!p.areia).map(p=>`<div class="linha-prod"><span>${esc(p.nome)}</span><b>${esc(fmtQ(p.qty))} ${esc(p.un)}</b></div>`).join('');
    return `<div class="campo" data-campo="${esc(c)}">
      <div class="campo-linha campo-meio"></div><div class="campo-circ"></div>
      <div class="campo-gol esq"></div><div class="campo-gol dir"></div>
      <div class="campo-painel">
        <div class="campo-nome">${esc(c)}</div>
        <div class="campo-areia"><span>Areia ${anoSel}</span><b>${fmtQ(r.areia)} m³</b></div>
        <div class="campo-bar"><i style="width:${pct}%"></i></div>
        <div class="campo-meta">meta ${META_AREIA} m³ · faltam ${fmtQ(Math.max(0,META_AREIA-r.areia))}</div>
        <div class="campo-chips">${chips}</div>
        ${outros ? `<div class="campo-prods">${outros}</div>` : ''}
        <div class="campo-ver">Toque para ver os manejos ›</div>
      </div>
    </div>`;
  }).join('');
  return `

  <div class="campo-grid">${campos}</div>`;

function renderCampoDetalhe(c){
  const r = resumoCampo(c, anoSel);
  const prods = r.prods.map(p=>`<div class="linha-prod"><span>${esc(p.nome)}</span><b>${esc(fmtQ(p.qty))} ${esc(p.un)}</b></div>`).join('') || '<div class="empty">Nenhum produto usado neste ano.</div>';
  const chips = TIPOS_INICIO.map(t=>`<span class="chip-man${r.cont[t]?' on':''}">${t} ${r.cont[t]}×</span>`).join('');
  const lista = r.list.length ? r.list.map(m=>cardManejo(m)).join('') : '<div class="card"><div class="empty">Nenhum manejo neste ano.</div></div>';
  return `
  <button class="back-link" id="btn-campo-voltar">← Voltar aos campos</button>
  <div class="ini-topo"><div class="section-title" style="margin:0;">${esc(c)} — ${anoSel}</div>${selectAno()}</div>
  <div class="card">
    <div class="campo-chips" style="margin-bottom:10px;">${chips}</div>
    <div class="section-title">Total de produtos no ano</div>
    ${prods}
    <div class="linha-prod" style="margin-top:8px;"><span>Custo no ano</span><b>${brl(r.custo)}</b></div>
  </div>
  <button class="primary" id="btn-novo-manejo-campo" style="margin-bottom:12px;">+ Novo manejo neste campo</button>
  <div class="section-title">Manejos do ano</div>
  ${lista}`;
}

function attachInicioHandlers(){

}

// ---------- MOVIMENTAÇÃO GERAL ----------
function getFilteredMovements(){
  const termo = movBusca.trim().toLowerCase();
  let moves = data.movements.slice().sort((a,b)=> new Date(b.date) - new Date(a.date));
  if(termo){
    moves = moves.filter(m=>{
      const p = findProduct(m.productId);
      const nome = p ? p.name.toLowerCase() : '';
      const motivo = (m.reason||'').toLowerCase();
      return nome.includes(termo) || motivo.includes(termo);
    });
  }
  return moves;
}

function renderMovimentacao(){
  const termo = movBusca.trim().toLowerCase();
  const moves = getFilteredMovements();
  const searchHtml = `<div class="search-row"><input id="mov-busca" type="text" placeholder="Buscar por produto ou motivo..." value="${esc(movBusca)}"></div>`;
  let listHtml;
  if(moves.length===0){
    listHtml = `<div class="empty">${termo ? 'Nenhuma movimentação encontrada.' : 'Nenhuma movimentação registrada ainda.'}</div>`;
  }else{
    listHtml = moves.map(m=>{
      const p = findProduct(m.productId);
      const cls = m.type==='entrada' ? 'hist-entrada' : 'hist-saida';
      const sign = m.type==='entrada' ? '+' : '−';
      return `<div class="hist-item">
        <div style="flex:1;">
          <div class="hist-top">
            <span>${p?esc(p.name):'(produto removido)'}</span>
            <span class="${cls}">${sign} ${esc(m.qty)} ${p?esc(p.unit):''}</span>
          </div>
          <div class="hist-meta">${fmtDate(m.date)} ${m.reason?'· '+esc(m.reason):''}</div>
        </div>
        <button class="del-btn" data-delmove="${esc(m.id)}" title="Excluir lançamento">✕</button>
      </div>`;
    }).join('');

  return `${searchHtml}<div class="card">${listHtml}</div>
  <button class="report-btn" id="btn-report-mov">Gerar relatório${termo ? ' filtrado' : ''} de movimentação (PDF)</button>`;
}

// ---------- HISTÓRICO (manejos realizados) ----------
function getFilteredManejos(){
  const term = histSearch.trim().toLowerCase();
  let list = data.manejos.slice().sort((a,b)=> new Date(b.date) - new Date(a.date));
  if(term){
    list = list.filter(m => (m.descricao||'').toLowerCase().includes(term) || (m.local||'').toLowerCase().includes(term));
  }
  if(histTipoFiltro==='Campo') list = list.filter(m=> m.tipo!=='implemento');
  else if(histTipoFiltro==='Implemento') list = list.filter(m=> m.tipo==='implemento');
  return list;
}

function renderHistoricoResumoLocais(){
  const list = getFilteredManejos();
  if(list.length===0) return `<div class="card"><div class="empty">Nenhum manejo encontrado.</div></div>`;
  const groups = {};
  list.forEach(m=>{
    const key = (m.tipo||'campo') + '::' + (m.local||'(sem local)');
    if(!groups[key]) groups[key] = { local: m.local||'(sem local)', tipo: m.tipo||'campo', count:0, last:m.date };
    groups[key].count++;
    if(new Date(m.date) > new Date(groups[key].last)) groups[key].last = m.date;
  });
  const rows = Object.values(groups).sort((a,b)=> a.local.localeCompare(b.local));
  const html = rows.map(g=>{
    const tipoLabel = g.tipo==='implemento' ? 'Implemento' : 'Campo';
    return `<div class="prod-item clickable" data-histlocal="${esc(g.local)}" data-histlocaltipo="${esc(g.tipo)}">
      <div>
        <div class="prod-name">${esc(g.local)}</div>
        <div class="prod-cat">${tipoLabel} · ${g.count} manejo(s) · último em ${fmtDateOnly(g.last)}</div>
      </div>
      <div class="prod-qty">›</div>
    </div>`;
  }).join('');
  return `<div class="section-title">Resumo por campo/implemento</div><div class="card">${html}</div>`;
}

function renderHistoricoLocalDetail(){
  const { local, tipo } = histLocalSelecionado;
  const manejosDoLocal = data.manejos
    .filter(m=> m.local===local && (m.tipo||'campo')===tipo)
    .sort((a,b)=> new Date(b.date) - new Date(a.date));
  const tipoLabel = tipo==='implemento' ? 'Implemento' : 'Campo';
  const custoTotal = manejosDoLocal.reduce((a,m)=>a+custoManejo(m),0);
  const porCar = {};
  manejosDoLocal.forEach(m=>{ const k = m.carrinho || '(implemento inteiro)'; (porCar[k] = porCar[k] || {n:0,c:0}); porCar[k].n++; porCar[k].c += custoManejo(m); });
  const resumoCar = (tipo==='implemento' && Object.keys(porCar).some(k=>k!=='(implemento inteiro)'))
    ? `<div class="card"><div class="section-title">Por carrinho</div>${Object.keys(porCar).sort().map(k=>`<div class="linha-prod"><span>${esc(k)} · ${porCar[k].n} manutenção(ões)</span><b>${brl(porCar[k].c)}</b></div>`).join('')}</div>` : '';

  const body = manejosDoLocal.length===0
    ? `<div class="card"><div class="empty">Nenhum manejo registrado aqui ainda.</div></div>`
    : manejosDoLocal.map(m=>cardManejo(m)).join('');

  return `
  <button class="back-link" id="btn-histlocal-voltar">← Voltar ao histórico</button>
  <div class="section-title">${tipoLabel} — ${esc(local)}</div>
  <div style="margin:-6px 0 10px;color:var(--text-muted);font-size:.85rem;">${manejosDoLocal.length} manejo(s) registrado(s) · custo total ${brl(custoTotal)}</div>
  ${resumoCar}
  ${body}
  `;
}

function renderHistorico(){
  if(histLocalSelecionado) return renderHistoricoLocalDetail();

  const tipos = ['Todos','Campo','Implemento'];
  const chips = tipos.map(t=>`<button data-histtipo="${esc(t)}" class="${histTipoFiltro===t?'active':''}">${esc(t)}</button>`).join('');
  return `
  <div class="search-row">
    <input id="hist-search" type="text" placeholder="Buscar por descrição ou local do manejo..." value="${esc(histSearch)}">
  </div>
  <div class="filter-chips">${chips}</div>
  ${renderHistoricoResumoLocais()}
  <button class="report-btn" id="btn-report-hist">Gerar relatório de manejos filtrados (PDF)</button>
  `;
}

function renderRelatoriosSelecao(){
  const term = relBusca.trim().toLowerCase();
  const cats = categorias();
  const chips = cats.map(c=>`<button data-relcat="${esc(c)}" class="${relFiltroCategoria===c?'active':''}">${esc(c)}</button>`).join('');

  let list = data.products.slice().sort((a,b)=>a.name.localeCompare(b.name));
  if(relFiltroCategoria!=='Todas') list = list.filter(p=>p.category===relFiltroCategoria);
  if(term) list = list.filter(p=>p.name.toLowerCase().includes(term));
  if(relFiltroBaixo==='sim') list = list.filter(p=> p.qty<=0 || p.qty<=p.min);

  const grouped = {};
  list.forEach(p=>{ (grouped[p.category]=grouped[p.category]||[]).push(p); });

  let itemsHtml = '';
  if(list.length===0){
    itemsHtml = `<div class="empty">Nenhum produto ou implemento encontrado.</div>`;
  } else {
    for(const cat in grouped){
      itemsHtml += `<div class="section-title">${esc(cat)}</div><div class="card">`;
      itemsHtml += grouped[cat].map(p=>{
        const checked = relSelecionados.has(p.id) ? 'checked' : '';
        const zerado = p.qty<=0, baixo = !zerado && p.qty<=p.min;
        const cls = zerado?'zerado':(baixo?'baixo':'');
        return `<label class="prod-item rel-row">
          <div class="rel-left">
            <input type="checkbox" class="rel-check" data-relid="${esc(p.id)}" ${checked}>
            <div>
              <div class="prod-name">${esc(p.name)}</div>
              <div class="prod-cat">mín. ${esc(p.min)} ${esc(p.unit)}</div>
            </div>
          </div>
          <div class="prod-qty ${cls}">${esc(p.qty)} ${esc(p.unit)}</div>
        </label>`;
      }).join('');
      itemsHtml += `</div>`;
    }
  }

  return `
  <div class="card">
    <div class="section-title">Relatório personalizado</div>
    <div>Escolha quais produtos, implementos ou itens de estoque entram no relatório ou no pedido de compra.</div>
    <div class="search-row" style="margin-top:12px;">
      <input id="rel-busca" type="text" placeholder="Buscar produto ou implemento..." value="${esc(relBusca)}">
    </div>
    <div class="filter-chips">${chips}</div>
    <label>Só perto do mínimo / zerado</label>
    <select id="rel-filtro-baixo">
      <option value="nao" ${relFiltroBaixo==='nao'?'selected':''}>Não</option>
      <option value="sim" ${relFiltroBaixo==='sim'?'selected':''}>Sim</option>
    </select>
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;">
      <button type="button" class="link" id="btn-rel-todos" style="padding:0;">Selecionar todos os filtrados</button>
      <button type="button" class="link" id="btn-rel-limpar" style="padding:0;">Limpar seleção</button>
    </div>
  </div>
  ${itemsHtml}
  <div class="card rel-bar">
    <div class="rel-bar-row" style="flex-wrap:wrap;">
      <span id="rel-count" style="font-weight:700;">${relSelecionados.size} selecionado(s)</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="secondary" id="btn-rel-gerar" style="width:auto;margin-top:0;">Relatório dos selecionados</button>
        <button class="primary" id="btn-rel-pedido-ir" style="width:auto;margin-top:0;">Gerar pedido dos selecionados</button>
      </div>
    </div>
  </div>
  `;
}

function renderRelatoriosPedido(){
  const selecionados = data.products.filter(p=>relSelecionados.has(p.id)).sort((a,b)=>a.name.localeCompare(b.name));

  if(selecionados.length===0){
    return `
    <button class="back-link" id="btn-pedido-voltar">← Voltar à seleção</button>
    <div class="card"><div class="empty">Nenhum produto selecionado ainda. Volte e marque os produtos que quer incluir no pedido.</div></div>
    `;
  }

  const grouped = {};
  selecionados.forEach(p=>{ (grouped[p.category]=grouped[p.category]||[]).push(p); });

  let itemsHtml = '';
  for(const cat in grouped){
    itemsHtml += `<div class="section-title">${esc(cat)}</div><div class="card">`;
    itemsHtml += grouped[cat].map(p=>{
      const val = relPedidoQtd[p.id] || '';
      return `<div class="prod-item">
        <div>
          <div class="prod-name">${esc(p.name)}</div>
          <div class="prod-cat">estoque atual: ${esc(p.qty)} ${esc(p.unit)}</div>
        </div>
        <input type="number" min="0" step="any" class="rel-pedido-qtd" data-relpedidoid="${esc(p.id)}" placeholder="Qtd. a pedir" value="${esc(val)}">
      </div>`;
    }).join('');
    itemsHtml += `</div>`;
  }

  const pedidoCount = selecionados.filter(p=>parseFloat(relPedidoQtd[p.id])>0).length;

  return `
  <button class="back-link" id="btn-pedido-voltar">← Voltar à seleção</button>
  <div class="card">
    <div class="section-title">Pedido de compra</div>
    <div>Informe a quantidade a pedir de cada item selecionado.</div>
  </div>
  ${itemsHtml}
  <div class="card">
    <label>Observação (opcional)</label>
    <textarea id="rel-pedido-obs" placeholder="Ex: entregar até sexta, fornecedor preferido...">${esc(relPedidoObs)}</textarea>
  </div>
  <div class="card rel-bar">
    <div class="rel-bar-row">
      <span id="rel-pedido-count" style="font-weight:700;">${pedidoCount} item(ns) no pedido</span>

}

function renderRelatorios(){
  return relModo==='pedido' ? renderRelatoriosPedido() : renderRelatoriosSelecao();
}

const ACAO_LABELS = {
  produto_criado: 'Produto cadastrado',
  produto_editado: 'Produto editado',
  produto_excluido: 'Produto excluído',
  entrada_estoque: 'Entrada de estoque',
  manejo_registrado: 'Manejo registrado',
  manejo_excluido: 'Manejo excluído',
  movimentacao_excluida: 'Movimentação excluída',
  implemento_criado: 'Implemento criado',
  implemento_excluido: 'Implemento excluído',
  pedido_gerado: 'Pedido de compra gerado',
  backup_importado: 'Backup importado'
};

function getFilteredAudit(){
  const term = audBusca.trim().toLowerCase();
  let list = data.audit.slice().sort((a,b)=> new Date(b.date) - new Date(a.date));
  if(audFiltroUsuario!=='Todos') list = list.filter(a=> a.userEmail===audFiltroUsuario);
  if(term){
    list = list.filter(a=>{
      const label = (ACAO_LABELS[a.acao]||a.acao||'').toLowerCase();
      return label.includes(term) || (a.detalhes||'').toLowerCase().includes(term) || (a.userEmail||'').toLowerCase().includes(term);
    });
  }
  return list;
}

function renderAuditoria(){
  const usuarios = ['Todos', ...new Set(data.audit.map(a=>a.userEmail).filter(Boolean))].sort();
  const opts = usuarios.map(u=>`<option value="${esc(u)}" ${audFiltroUsuario===u?'selected':''}>${esc(u)}</option>`).join('');
  const list = getFilteredAudit();

  let listHtml;
  if(list.length===0){
    listHtml = `<div class="empty">Nenhum registro encontrado.</div>`;
  } else {
    listHtml = list.map(a=>{
      return `<div class="hist-item">
        <div style="flex:1;">
          <div class="hist-top">
            <span>${esc(ACAO_LABELS[a.acao]||a.acao)}</span>
            <span>${fmtDate(a.date)}</span>
          </div>
          <div class="hist-meta">${esc(a.userEmail)}${a.detalhes? ' · '+esc(a.detalhes) : ''}</div>
        </div>
      </div>`;
    }).join('');
  }

  return `
  <div class="card">
    <div class="section-title">Auditoria</div>
    <div>Veja quem cadastrou, alterou ou excluiu qualquer coisa no sistema.</div>
    <div class="search-row" style="margin-top:12px;">
      <input id="aud-busca" type="text" placeholder="Buscar por ação, detalhe ou usuário..." value="${esc(audBusca)}">
    </div>
    <label>Usuário</label>
    <select id="aud-filtro-usuario">${opts}</select>
  </div>
  <div class="card">${listHtml}</div>
  `;
}

function attachHandlers(){
  if(currentTab==='estoque'){
    if(estoqueMostrarEntrada){
      document.getElementById('btn-entrada-voltar').onclick = ()=>{ estoqueMostrarEntrada=false; render(); };
      document.querySelectorAll('[data-modo]').forEach(b=>{
        b.onclick = ()=>{ entradaModo = b.dataset.modo; render(); };
      });
      const entBuscaEl = document.getElementById('ent-busca');
      if(entBuscaEl) entBuscaEl.oninput = ()=>{
        entBusca = entBuscaEl.value;
        const sel = document.getElementById('ent-produto');
        const termo = entBusca.trim().toLowerCase();
        const filtrados = data.products.slice().sort((a,b)=>a.name.localeCompare(b.name))
          .filter(p=> !termo || p.name.toLowerCase().includes(termo));
        sel.innerHTML = filtrados.length
          ? filtrados.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} (${esc(p.category)})</option>`).join('')
          : '<option value="">Nenhum produto encontrado</option>';
      };
      document.getElementById('btn-entrada').onclick = onEntrada;
    } else if(selectedProductId){
      document.getElementById('btn-back-produto').onclick = ()=>{ selectedProductId=null; render(); };
      document.getElementById('btn-salvar-produto').onclick = onSalvarProduto;
      document.getElementById('btn-excluir-produto').onclick = onExcluirProduto;
    } else {
      document.getElementById('btn-entrada-abrir').onclick = ()=>{ estoqueMostrarEntrada=true; render(); };
      document.getElementById('est-busca').oninput = (e)=>{ estoqueBusca = e.target.value; render(); };
      document.querySelectorAll('[data-cat]').forEach(b=>{
        b.onclick = ()=>{ filtroCategoria = b.dataset.cat; render(); };
      });
      document.getElementById('box-baixo').onclick = ()=>{ estoqueDrawer = estoqueDrawer==='baixo' ? null : 'baixo'; render(); };
      document.getElementById('box-zerado').onclick = ()=>{ estoqueDrawer = estoqueDrawer==='zerado' ? null : 'zerado'; render(); };
      const dc = document.getElementById('btn-drawer-close');
      if(dc) dc.onclick = ()=>{ estoqueDrawer=null; render(); };
      document.getElementById('btn-report-estoque').onclick = ()=>openReport('estoque');
      document.querySelectorAll('[data-open]').forEach(el=>{
        el.onclick = ()=>{ selectedProductId = el.dataset.open; render(); };
      });
    }
  }

  if(currentTab==='manejos'){
    const captureFormState = ()=>{};

    document.querySelectorAll('[data-tipo]').forEach(b=>{
      b.onclick = ()=>{
        captureFormState();
        manTipo = b.dataset.tipo;
        manCat = '';
        manMostrarProd = false;
        render();
      };
    });

    document.querySelectorAll('[data-mcat]').forEach(b=>{
      b.onclick = ()=>{ manCat = b.dataset.mcat; render(); };
    });
    document.querySelectorAll('[data-mcampo]').forEach(b=>{
      b.onclick = ()=>{ manCampo = b.dataset.mcampo; render(); };
    });
    const btnMostrar = document.getElementById('btn-mostrar-prod');
    if(btnMostrar) btnMostrar.onclick = ()=>{ manMostrarProd = true; render(); };
    const outroEl = document.getElementById('man-campo-outro');
    if(outroEl) outroEl.oninput = ()=>{ manCampoOutro = outroEl.value; };
    const implEl = document.getElementById('man-implemento');
    if(implEl) implEl.onchange = (e)=>{ captureFormState(); manImplementoId = e.target.value; manCarrinho = ''; render(); };
    const carEl2 = document.getElementById('man-carrinho');
    if(carEl2) carEl2.onchange = (e)=>{ manCarrinho = e.target.value; };
    const btnNovoCar = document.getElementById('btn-novo-carrinho');
    if(btnNovoCar) btnNovoCar.onclick = async ()=>{
      captureFormState();
      const imp = findProduct(manImplementoId); if(!imp) return;
      const nome = (window.prompt('Nome do carrinho (ex.: Carrinho 1):') || '').trim();
      if(!nome) return;
      imp.carrinhos = imp.carrinhos || [];
      if(!imp.carrinhos.includes(nome)) imp.carrinhos.push(nome);
      manCarrinho = nome;
      render();
      await persistProduct(imp);
      logAudit('carrinho_criado', `${imp.name}: ${nome}`);
    };
    const btnExcCar = document.getElementById('btn-excluir-carrinho');
    if(btnExcCar) btnExcCar.onclick = async ()=>{
      captureFormState();
      const imp = findProduct(manImplementoId);
      if(!imp || !manCarrinho){ showToast('Escolha o carrinho que quer excluir.', 'err'); return; }
      const ok = await confirmModal(`Excluir o carrinho "${manCarrinho}" de ${imp.name}? O histórico já registrado é mantido.`, {okLabel:'Excluir', danger:true});
      if(!ok) return;
      imp.carrinhos = (imp.carrinhos||[]).filter(c=>c!==manCarrinho);
      manCarrinho = '';
      render();
      await persistProduct(imp);
    };
    document.getElementById('man-data').onchange = (e)=>{ manData = e.target.value; };
    document.getElementById('man-desc').oninput = (e)=>{ manDesc = e.target.value; };
    document.getElementById('man-extra').oninput = (e)=>{ manExtra = e.target.value; };
    const btnCancelEd = document.getElementById('btn-cancelar-edicao');
    if(btnCancelEd) btnCancelEd.onclick = ()=>{ limparFormManejo(); render(); };

    const btnNovoImpl = document.getElementById('btn-novo-implemento');
    if(btnNovoImpl) btnNovoImpl.onclick = ()=>{
      captureFormState();
      manNovoImplementoAberto = true;
      manNovoImplementoNome = '';
      render();
    };
    const btnCancelarNovoImpl = document.getElementById('btn-cancelar-novo-implemento');
    if(btnCancelarNovoImpl) btnCancelarNovoImpl.onclick = ()=>{
      captureFormState();
      manNovoImplementoAberto = false;
      render();
    };
    const nomeNovoImplEl = document.getElementById('man-novo-implemento-nome');
    if(nomeNovoImplEl) nomeNovoImplEl.oninput = ()=>{ manNovoImplementoNome = nomeNovoImplEl.value; };
    const btnConfirmarNovoImpl = document.getElementById('btn-confirmar-novo-implemento');
    if(btnConfirmarNovoImpl) btnConfirmarNovoImpl.onclick = async ()=>{
      const nome = document.getElementById('man-novo-implemento-nome').value.trim();
      if(!nome) return;
      const novo = {id: uid('p'), name:nome, category:'Implemento', unit:'un', qty:1, min:0, obs:''};
      data.products.push(novo);
      captureFormState();
      manImplementoId = novo.id;
      manNovoImplementoAberto = false;
      manNovoImplementoNome = '';
      render();
      await persistProduct(novo);
      showToast(`Implemento "${novo.name}" adicionado.`, 'ok');
      logAudit('implemento_criado', novo.name);
    };
    const btnEditarImpl = document.getElementById('btn-editar-implemento');
    if(btnEditarImpl) btnEditarImpl.onclick = ()=>{
      if(!manImplementoId){ showToast('Selecione um implemento primeiro.', 'err'); return; }
      captureFormState();
      selectedProductId = manImplementoId;
      currentTab = 'estoque';
      render();
    };
    const btnExcluirImpl = document.getElementById('btn-excluir-implemento');
    if(btnExcluirImpl) btnExcluirImpl.onclick = async ()=>{
      if(!manImplementoId){ showToast('Selecione um implemento primeiro.', 'err'); return; }
      const impl = findProduct(manImplementoId);
      if(!impl) return;
      const ok = await confirmModal(`Excluir o implemento "${impl.name}"? O histórico de manejos já registrado é mantido.`, {okLabel:'Excluir', danger:true});
      if(!ok) return;
      data.products = data.products.filter(p=>p.id!==manImplementoId);
      captureFormState();
      const removedId = manImplementoId;
      manImplementoId = '';
      render();
      await deleteProductRemote(removedId);
      showToast('Implemento excluído.', 'ok');
      logAudit('implemento_excluido', impl.name);
    };

    const btnAddItem = document.getElementById('btn-add-item');
    if(btnAddItem) btnAddItem.onclick = ()=>{
      manejoItens.push({name:'', qty:''});
      render();
    };
    document.querySelectorAll('[data-remove]').forEach(b=>{
      b.onclick = ()=>{
        const idx = parseInt(b.dataset.remove);
        if(manejoItens.length>1) manejoItens.splice(idx,1); else manejoItens = [{name:'', qty:''}];
        render();
      };
    });
    document.querySelectorAll('.manejo-nome').forEach(inp=>{
      inp.onchange = ()=>{ manejoItens[parseInt(inp.dataset.idx)].name = inp.value; render(); };
    });
    document.querySelectorAll('.manejo-qtd').forEach(inp=>{
      inp.oninput = ()=>{ manejoItens[parseInt(inp.dataset.idx)].qty = inp.value; };
    });
    document.getElementById('btn-manejo').onclick = onManejo;
    document.getElementById('btn-report-manejos').onclick = ()=>openReport('manejos');
  }

  if(currentTab==='movimentacao'){
    document.getElementById('mov-busca').oninput = (e)=>{ movBusca = e.target.value; render(); };
    document.querySelectorAll('[data-delmove]').forEach(b=>{
      b.onclick = ()=> deleteMovement(b.dataset.delmove);
    });
    document.getElementById('btn-report-mov').onclick = ()=>openReport('movimentacao', getFilteredMovements());
  }

  if(currentTab==='historico'){
    if(histLocalSelecionado){
      document.getElementById('btn-histlocal-voltar').onclick = ()=>{ histLocalSelecionado = null; render(); };
      attachManejoCardHandlers();
    } else {
      document.getElementById('hist-search').oninput = (e)=>{ histSearch = e.target.value; render(); };
      document.querySelectorAll('[data-histtipo]').forEach(b=>{
        b.onclick = ()=>{ histTipoFiltro = b.dataset.histtipo; render(); };
      });
      document.querySelectorAll('[data-histlocal]').forEach(el=>{
        el.onclick = ()=>{ histLocalSelecionado = { local: el.dataset.histlocal, tipo: el.dataset.histlocaltipo }; render(); };
      });
      document.getElementById('btn-report-hist').onclick = ()=>openReport('manejos', getFilteredManejos());
    }
  }

  if(currentTab==='relatorios'){
    if(relModo==='estoque'){
      document.getElementById('rel-busca').oninput = (e)=>{ relBusca = e.target.value; render(); };
      document.querySelectorAll('[data-relcat]').forEach(b=>{
        b.onclick = ()=>{ relFiltroCategoria = b.dataset.relcat; render(); };
      });
      const filtroBaixoEl = document.getElementById('rel-filtro-baixo');
      if(filtroBaixoEl) filtroBaixoEl.onchange = ()=>{ relFiltroBaixo = filtroBaixoEl.value; render(); };
      document.querySelectorAll('.rel-check').forEach(chk=>{
        chk.onchange = ()=>{
          const id = chk.dataset.relid;
          if(chk.checked) relSelecionados.add(id); else relSelecionados.delete(id);
          updateRelCount();
        };
      });
      document.getElementById('btn-rel-todos').onclick = ()=>{
        document.querySelectorAll('.rel-check').forEach(chk=> relSelecionados.add(chk.dataset.relid));
        render();
      };
      document.getElementById('btn-rel-limpar').onclick = ()=>{
        relSelecionados.clear();
        render();
      };
      document.getElementById('btn-rel-gerar').onclick = ()=>{
        if(relSelecionados.size===0){ showToast('Selecione ao menos um item.', 'err'); return; }
        openReport('personalizado');
      };
      document.getElementById('btn-rel-pedido-ir').onclick = ()=>{
        if(relSelecionados.size===0){ showToast('Selecione ao menos um item.', 'err'); return; }
        relModo = 'pedido';
        render();
      };
    } else {
      const voltarBtn = document.getElementById('btn-pedido-voltar');
      if(voltarBtn) voltarBtn.onclick = ()=>{ relModo = 'estoque'; render(); };
      document.querySelectorAll('.rel-pedido-qtd').forEach(inp=>{
        inp.oninput = ()=>{
          const id = inp.dataset.relpedidoid;
          if(inp.value.trim()==='') delete relPedidoQtd[id];
          else relPedidoQtd[id] = inp.value;
          updatePedidoCount();
        };
      });
      const obsEl = document.getElementById('rel-pedido-obs');
      if(obsEl) obsEl.oninput = ()=>{ relPedidoObs = obsEl.value; };
      const gerarBtn = document.getElementById('btn-rel-pedido-gerar');
      if(gerarBtn) gerarBtn.onclick = ()=>{
        const qtdItens = [...relSelecionados].filter(id=>parseFloat(relPedidoQtd[id])>0);
        if(qtdItens.length===0){ showToast('Preencha a quantidade de ao menos um item.', 'err'); return; }
        openReport('pedido');
      };
    }
  }

  if(currentTab==='inicio') attachInicioHandlers();

  if(currentTab==='auditoria'){
    document.getElementById('aud-busca').oninput = (e)=>{ audBusca = e.target.value; render(); };
    document.getElementById('aud-filtro-usuario').onchange = (e)=>{ audFiltroUsuario = e.target.value; render(); };
  }
}

function updatePedidoCount(){
  const el = document.getElementById('rel-pedido-count');
  if(el){
    const n = [...relSelecionados].filter(id=>parseFloat(relPedidoQtd[id])>0).length;
    el.textContent = n + ' item(ns) no pedido';

}

function updateRelCount(){

}
