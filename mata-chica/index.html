async function onEntrada(){
  if(entradaModo==='existente'){
    const id = document.getElementById('ent-produto').value;
    const qtd = parseFloat(document.getElementById('ent-qtd').value);
    if(!qtd || qtd<=0){ showToast('Informe uma quantidade válida.', 'err'); return; }
    const p = findProduct(id);
    if(!p){ showToast('Produto não encontrado.', 'err'); return; }
    p.qty += qtd;
    const vNovo = parseFloat(document.getElementById('ent-valor').value);
    if(vNovo>0) p.valor = vNovo;
    const mv = {id:uid('m'), date:new Date().toISOString(), type:'entrada', productId:id, qty:qtd, reason:'Reposição de estoque'};
    data.movements.push(mv);
    render();
    await Promise.all([persistProduct(p), persistMovement(mv)]);
    showToast(`Entrada registrada: +${qtd} ${p.unit} em ${p.name}.`, 'ok');
    logAudit('entrada_estoque', `${p.name}: +${qtd} ${p.unit} (estoque atual: ${p.qty} ${p.unit})`);
  } else {
    const nome = document.getElementById('ent-nome').value.trim();
    const cat = document.getElementById('ent-cat').value.trim() || 'Outros';
    const un = document.getElementById('ent-un').value.trim() || 'un';
    const qtd = parseFloat(document.getElementById('ent-qtd-novo').value) || 0;
    const min = parseFloat(document.getElementById('ent-min-novo').value) || 0;
    const obs = document.getElementById('ent-obs-novo').value.trim();
    if(!nome){ showToast('Informe o nome do produto.', 'err'); return; }
    const novo = {id: uid('p'), name:nome, category:cat, unit:un, qty:qtd, min:min, obs:obs, valor: parseFloat(document.getElementById('ent-valor-novo').value) || 0};
    data.products.push(novo);
    let mv = null;
    if(qtd>0){
      mv = {id:uid('m'), date:new Date().toISOString(), type:'entrada', productId:novo.id, qty:qtd, reason:'Cadastro inicial'};
      data.movements.push(mv);
    }
    entradaModo = 'existente';
    render();
    await Promise.all([persistProduct(novo), mv ? persistMovement(mv) : Promise.resolve()]);
    showToast(`Produto "${nome}" cadastrado.`, 'ok');
    logAudit('produto_criado', `${nome} (${novo.category}) — qtd inicial: ${qtd} ${un}`);
  }
}

function limparFormManejo(){
  manejoItens = [{name:'', qty:''}];
  manTipo = 'campo';
  manCampo = '';
  manMostrarProd = false;
  manCampoOutro = '';
  manImplementoId = '';
  manDesc = '';
  manCat = '';
  manExtra = '';
  manCarrinho = '';
  manEditId = null;
  manData = new Date().toISOString().slice(0,10);
}

function editarManejo(id){
  const m = data.manejos.find(x=>x.id===id);
  if(!m) return;
  manEditId = id;
  manTipo = m.tipo==='implemento' ? 'implemento' : 'campo';
  manImplementoId = m.implementoId || '';
  if(manTipo==='campo'){
    if(CAMPO_OPCOES.includes(m.local) && m.local!=='Outro'){ manCampo = m.local; manCampoOutro = ''; }
    else { manCampo = 'Outro'; manCampoOutro = m.local || ''; }
  }
  manData = new Date(m.date).toISOString().slice(0,10);
  manDesc = m.descricao || '';
  manCat = tipoManejo(m);
  manMostrarProd = (m.itens||[]).length>0;
  manExtra = m.extra ? String(m.extra) : '';
  manCarrinho = m.carrinho || '';
  manejoItens = (m.itens||[]).map(it=>{ const p = findProduct(it.productId); return {name: p?p.name:'', qty: String(it.qty)}; });
  if(manejoItens.length===0) manejoItens = [{name:'', qty:''}];
  currentTab = 'manejos';
  render();
  window.scrollTo(0,0);
}

async function onManejo(){
  let local = '';
  let implementoId = '';

  if(!manCat){ showToast('Escolha o que foi feito (passo 1).', 'err'); return; }
  if(manTipo==='campo'){
    if(!manCampo){ showToast('Escolha o campo (passo 2).', 'err'); return; }
    const campoOutro = (manCampoOutro||'').trim();
    if(manCampo==='Outro' && !campoOutro){ showToast('Diga qual é o local (passo 2).', 'err'); return; }
    local = manCampo==='Outro' ? campoOutro : manCampo;
  } else {
    implementoId = manImplementoId;
    if(!implementoId){ showToast('Escolha a máquina (passo 2).', 'err'); return; }
    const implProd = findProduct(implementoId);
    if(!implProd){ showToast('Máquina inválida, escolha de novo.', 'err'); return; }
    local = implProd.name;
  }

  const dataStr = manData;
  const desc = (manDesc||'').trim();
  const categoria = manCat;
  const extra = parseFloat(manExtra) || 0;
  const carrinho = manTipo==='implemento' ? manCarrinho : '';

  const incompleta = manejoItens.find(it=> it.name && !(parseFloat(it.qty) > 0));
  if(incompleta){ showToast(`Falta a quantidade de "${incompleta.name}". Preencha ou tire o produto.`, 'err'); return; }
  const linhas = manejoItens
    .map((it,idx)=>({...it, idx}))
    .filter(it=> it.name.trim() && parseFloat(it.qty) > 0);

  const antigo = manEditId ? data.manejos.find(x=>x.id===manEditId) : null;
  const devolver = {};
  if(antigo) (antigo.itens||[]).forEach(it=>{ devolver[it.productId] = (devolver[it.productId]||0) + it.qty; });

  const resolvidos = [];
  for(const linha of linhas){
    const nomeDigitado = linha.name.trim();
    const qtd = parseFloat(linha.qty);
    let p = data.products.find(x=> x.name.toLowerCase() === nomeDigitado.toLowerCase());

    if(!p){
      const cadastrar = await confirmModal(`O produto "${nomeDigitado}" não está cadastrado no estoque. Deseja cadastrá-lo agora?`, {okLabel:'Cadastrar'});
      if(!cadastrar){
        showToast(`Cadastre ou corrija o nome de "${nomeDigitado}" antes de continuar.`, 'err');
        return;
      }
      p = {id: uid('p'), name: nomeDigitado, category:'Outros', unit:'un', qty:0, min:0, valor:0, obs:'Cadastrado automaticamente via manejo'};
      data.products.push(p);
    }

    const disponivel = p.qty + (devolver[p.id]||0);
    if(qtd > disponivel){
      const prosseguir = await confirmModal(`Estoque insuficiente de "${p.name}" (disponível: ${disponivel} ${p.unit}). Deseja registrar essa saída mesmo assim? O estoque ficará zerado (nunca negativo).`, {okLabel:'Registrar mesmo assim'});
      if(!prosseguir){
        showToast(`Ajuste a quantidade de "${p.name}" ou faça uma entrada antes de continuar.`, 'err');
        return;
      }
    }
    resolvidos.push({ product: p, qtd });
  }

  // tudo validado: agora mexe no estoque
  const tocados = new Map();
  let movsRemover = [];
  if(antigo){
    (antigo.itens||[]).forEach(it=>{
      const p = findProduct(it.productId);
      if(p){ p.qty += it.qty; tocados.set(p.id, p); }
    });
    movsRemover = data.movements.filter(m=>m.manejoId === antigo.id).map(m=>m.id);
    data.movements = data.movements.filter(m=>m.manejoId !== antigo.id);
    data.manejos = data.manejos.filter(m=>m.id !== antigo.id);
  }

  const manejoId = antigo ? antigo.id : uid('mj');
  const dataISO = dataStr ? new Date(dataStr+'T12:00:00').toISOString() : new Date().toISOString();
  const novasMovs = [];

  resolvidos.forEach(({product:p, qtd})=>{
    p.qty = Math.max(0, p.qty - qtd);
    tocados.set(p.id, p);
    const mv = { id: uid('m'), date: dataISO, type:'saida', productId: p.id, qty: qtd,
      reason: `Manejo (${categoria}): ${local}${carrinho?' / '+carrinho:''}${desc?' — '+desc:''}`, manejoId };
    data.movements.push(mv);
    novasMovs.push(mv);
  });

  const manejo = {
    id: manejoId, date: dataISO, tipo: manTipo, categoria, carrinho, local, implementoId, descricao: desc, extra,
    itens: resolvidos.map(r=>({productId: r.product.id, qty: r.qtd, valor: r.product.valor || 0}))
  };
  data.manejos.push(manejo);

  const tipoLabelAudit = manTipo==='implemento' ? 'Implemento' : 'Campo';
  const itensAudit = resolvidos.map(r=> `${r.product.name} -${r.qtd} ${r.product.unit}`).join(', ');
  const foiEdicao = !!antigo;

  limparFormManejo();
  render();

  await Promise.all([
    ...[...tocados.values()].map(persistProduct),
    ...movsRemover.map(deleteMovementRemote),
    ...novasMovs.map(persistMovement),
    persistManejo(manejo)
  ]);
  showToast(foiEdicao ? 'Manejo alterado e estoque corrigido.' : 'Manejo registrado e baixa de estoque realizada.', 'ok');
  logAudit(foiEdicao ? 'manejo_alterado' : 'manejo_registrado', `[${tipoLabelAudit}/${categoria}] ${local}: ${itensAudit || 'sem produtos'}`);
}

async function onSalvarProduto(){
  const p = findProduct(selectedProductId);
  if(!p) return;
  const nome = document.getElementById('pd-nome').value.trim();
  const cat = document.getElementById('pd-cat').value.trim();
  const un = document.getElementById('pd-un').value.trim();
  const qtd = parseFloat(document.getElementById('pd-qtd').value);
  const min = parseFloat(document.getElementById('pd-min').value);
  const obs = document.getElementById('pd-obs').value.trim();
  const valor = parseFloat(document.getElementById('pd-valor').value) || 0;

  if(!nome){ showToast('Informe o nome do produto.', 'err'); return; }
  if(isNaN(qtd) || qtd<0){ showToast('Informe uma quantidade atual válida.', 'err'); return; }
  if(isNaN(min) || min<0){ showToast('Informe um estoque mínimo válido.', 'err'); return; }

  const qtyAntes = p.qty, minAntes = p.min, nomeAntes = p.name;

  let mv = null;
  if(qtd !== p.qty){
    const diff = qtd - p.qty;
    mv = {
      id:uid('m'), date:new Date().toISOString(),
      type: diff>0 ? 'entrada':'saida', productId:p.id, qty:Math.abs(diff),
      reason:'Ajuste manual de cadastro'
    };
    data.movements.push(mv);
  }
  p.name = nome;
  p.category = cat || 'Outros';
  p.unit = un || 'un';
  p.qty = qtd;
  p.min = min;
  p.obs = obs;
  p.valor = valor;

  render();
  await Promise.all([persistProduct(p), mv ? persistMovement(mv) : Promise.resolve()]);
  showToast('Cadastro atualizado.', 'ok');
  logAudit('produto_editado', `${nomeAntes}${nomeAntes!==nome?' → '+nome:''} — qtd: ${qtyAntes}→${qtd} ${un}, mín: ${minAntes}→${min}`);
}

async function onExcluirProduto(){
  const p = findProduct(selectedProductId);
  if(!p) return;
  const ok = await confirmModal(`Excluir "${p.name}" do cadastro de estoque? O histórico de movimentações já registrado é mantido.`, {okLabel:'Excluir', danger:true});
  if(!ok) return;
  data.products = data.products.filter(x=>x.id!==p.id);
  selectedProductId = null;
  render();
  await deleteProductRemote(p.id);
  showToast('Produto excluído.', 'ok');
  logAudit('produto_excluido', p.name);
}

async function deleteMovement(id){
  const idx = data.movements.findIndex(m=>m.id===id);
  if(idx<0) return;
  const mv = data.movements[idx];
  const isPartOfManejo = !!mv.manejoId;
  const confirmMsg = isPartOfManejo
    ? 'Este lançamento faz parte de um manejo registrado. Excluir vai devolver a quantidade ao estoque e remover este item do manejo. Confirmar?'
    : 'Excluir este lançamento? O estoque será ajustado de volta.';
  const ok = await confirmModal(confirmMsg, {okLabel:'Excluir', danger:true});
  if(!ok) return;

  const p = findProduct(mv.productId);
  if(p){
    if(mv.type==='entrada') p.qty = Math.max(0, p.qty - mv.qty);
    else p.qty += mv.qty;
  }
  data.movements.splice(idx,1);

  let manejoToDelete = null;
  let manejoToUpdate = null;
  if(mv.manejoId){
    const manejo = data.manejos.find(mj=>mj.id===mv.manejoId);
    if(manejo){
      const iidx = manejo.itens.findIndex(it=>it.productId===mv.productId && it.qty===mv.qty);
      if(iidx>=0) manejo.itens.splice(iidx,1);
      if(manejo.itens.length===0){
        data.manejos = data.manejos.filter(m=>m.id!==manejo.id);
        manejoToDelete = manejo.id;
      } else {
        manejoToUpdate = manejo;
      }
    }
  }

  render();
  const jobs = [deleteMovementRemote(id)];
  if(p) jobs.push(persistProduct(p));
  if(manejoToDelete) jobs.push(deleteManejoRemote(manejoToDelete));
  if(manejoToUpdate) jobs.push(persistManejo(manejoToUpdate));
  await Promise.all(jobs);
  showToast('Lançamento excluído.', 'ok');
  logAudit('movimentacao_excluida', `${p?p.name:'(produto removido)'}: ${mv.type==='entrada'?'entrada':'saída'} de ${mv.qty} excluída`);
}

async function deleteManejo(id){
  const manejo = data.manejos.find(m=>m.id===id);
  if(!manejo) return;
  const ok = await confirmModal(`Excluir o manejo "${manejo.local}"? Isso devolve ao estoque todos os produtos usados nele e remove os lançamentos ligados.`, {okLabel:'Excluir', danger:true});
  if(!ok) return;

  const touchedProducts = [];
  (manejo.itens||[]).forEach(it=>{
    const p = findProduct(it.productId);
    if(p){ p.qty += it.qty; touchedProducts.push(p); }
  });
  const removedMovIds = data.movements.filter(m=>m.manejoId === id).map(m=>m.id);
  data.movements = data.movements.filter(m=>m.manejoId !== id);
  data.manejos = data.manejos.filter(m=>m.id !== id);

  render();
  await Promise.all([
    ...touchedProducts.map(persistProduct),
    ...removedMovIds.map(deleteMovementRemote),
    deleteManejoRemote(id)
  ]);
  showToast('Manejo excluído.', 'ok');
  logAudit('manejo_excluido', `${manejo.local} (${fmtDateOnly(manejo.date)})`);
}

// ---------- UI: MODAL / TOAST ----------
function confirmModal(message, opts){
  opts = opts || {};
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const okLabel = opts.okLabel || 'Confirmar';
    const cancelLabel = opts.cancelLabel || 'Cancelar';
    const dangerCls = opts.danger ? ' danger' : '';
    overlay.innerHTML = `
      <div class="modal-box" role="alertdialog" aria-modal="true">
        <p class="modal-msg">${esc(message)}</p>
        <div class="modal-actions">
          <button type="button" class="secondary" id="modal-cancel">${esc(cancelLabel)}</button>
          <button type="button" class="primary${dangerCls}" id="modal-ok">${esc(okLabel)}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const cleanup = (val)=>{
      document.removeEventListener('keydown', onKey);
      overlay.remove();
      resolve(val);
    };
    const onKey = (e)=>{ if(e.key==='Escape') cleanup(false); };
    overlay.querySelector('#modal-cancel').onclick = ()=>cleanup(false);
    overlay.querySelector('#modal-ok').onclick = ()=>cleanup(true);
    overlay.onclick = (e)=>{ if(e.target===overlay) cleanup(false); };
    document.addEventListener('keydown', onKey);
    overlay.querySelector('#modal-ok').focus();
  });
}

function showToast(text, type){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast ' + (type||'ok');
  el.textContent = text;
  wrap.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=> el.remove(), 250);
  }, 3800);
}

// ---------- RELATÓRIOS / PDF ----------
const PDF_MARGIN = 15;
const PDF_PAGE_W = 210;
const PDF_PAGE_H = 297;
const PDF_ROW_H = 6;

function pdfTruncate(s, n){
  s = String(s==null?'':s);
  return s.length>n ? s.slice(0,n-1)+'…' : s;
}

function pdfNewDoc(title, subtitle){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  doc.setFont('helvetica','bold');
  doc.setFontSize(15);
  doc.text(title, PDF_MARGIN, 18);
  doc.setFont('helvetica','normal');
  doc.setFontSize(9);
  doc.setTextColor(110);
  doc.text(subtitle, PDF_MARGIN, 24);
  doc.setTextColor(25);
  doc._y = 32;
  return doc;
}

function pdfEnsureSpace(doc, needed){
  if(doc._y + needed > PDF_PAGE_H - PDF_MARGIN){
    doc.addPage();
    doc._y = 20;
  }
}

function pdfSectionTitle(doc, text){
  pdfEnsureSpace(doc, 10);
  doc.setFont('helvetica','bold');
  doc.setFontSize(11);
  doc.setTextColor(25);
  doc.text(text, PDF_MARGIN, doc._y);
  doc._y += 6;
}

function pdfParagraph(doc, text){
  const maxWidth = PDF_PAGE_W - PDF_MARGIN*2;
  doc.setFont('helvetica','normal');
  doc.setFontSize(9.5);
  doc.setTextColor(60);
  const lines = doc.splitTextToSize(String(text||''), maxWidth);
  lines.forEach(line=>{
    pdfEnsureSpace(doc, 5);
    doc.text(line, PDF_MARGIN, doc._y);
    doc._y += 5;
  });
  doc.setTextColor(25);
  doc._y += 1;
}

function pdfTableHeader(doc, headers, colWidths){
  const totalW = colWidths.reduce((a,b)=>a+b,0);
  doc.setFillColor(238,235,224);
  doc.setDrawColor(200,195,175);
  doc.rect(PDF_MARGIN, doc._y-4.3, totalW, PDF_ROW_H, 'FD');
  doc.setFont('helvetica','bold');
  doc.setFontSize(8.3);
  doc.setTextColor(25);
  let x = PDF_MARGIN;
  headers.forEach((h,i)=>{ doc.text(String(h), x+1.5, doc._y); x += colWidths[i]; });
  doc._y += PDF_ROW_H;
}

function pdfTable(doc, headers, colWidths, rows){
  pdfEnsureSpace(doc, PDF_ROW_H*2);
  pdfTableHeader(doc, headers, colWidths);
  doc.setFont('helvetica','normal');
  doc.setFontSize(8.3);
  rows.forEach(cells=>{
    const wasNewPage = doc._y + PDF_ROW_H > PDF_PAGE_H - PDF_MARGIN;
    pdfEnsureSpace(doc, PDF_ROW_H);
    if(wasNewPage) pdfTableHeader(doc, headers, colWidths);
    let x = PDF_MARGIN;
    cells.forEach((c,i)=>{
      const w = colWidths[i];
      doc.text(pdfTruncate(c, Math.floor(w/1.7)), x+1.5, doc._y);
      x += w;
    });
    doc._y += PDF_ROW_H;
  });
  doc._y += 4;
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 4000);
}

async function exportPdf(doc, filename){
  try{
    const blob = doc.output('blob');
    downloadBlob(blob, filename);
    showToast('PDF gerado.', 'ok');
  }catch(e){
    console.error(e);
    showToast('Não foi possível gerar o PDF.', 'err');
  }
}

function buildStockDoc(products, title){
  const doc = pdfNewDoc(title, `Mata Chica Polo Club · Gerado em ${fmtDate(new Date().toISOString())} · ${products.length} item(ns)`);
  const cats = {};
  products.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(p=>{
    (cats[p.category] = cats[p.category] || []).push(p);
  });
  const headers = ['Produto','Qtd.','Unid.','Mín.','Status','Observações'];
  const widths = [50,16,16,16,20,62];
  for(const cat in cats){
    pdfSectionTitle(doc, cat);
    const rows = cats[cat].map(p=>{
      const status = p.qty<=0 ? 'ZERADO' : (p.qty<=p.min ? 'BAIXO' : 'OK');
      return [p.name, String(p.qty), p.unit, String(p.min), status, p.obs||''];
    });
    pdfTable(doc, headers, widths, rows);
  }
  return doc;
}

function openReport(type, listOverride){
  if(!window.jspdf || !window.jspdf.jsPDF){
    showToast('Não foi possível carregar o gerador de PDF. Verifique sua conexão e tente novamente.', 'err');
    return;
  }
  const stamp = new Date().toISOString().slice(0,10);

  if(type==='estoque'){
    const doc = buildStockDoc(data.products, 'Mata Chica Polo Club — Relatório de Estoque');
    exportPdf(doc, `mata-chica-estoque-${stamp}.pdf`);

  } else if(type==='movimentacao'){
    const moves = listOverride || data.movements.slice().sort((a,b)=> new Date(b.date) - new Date(a.date));
    const subtitle = `Gerado em ${fmtDate(new Date().toISOString())}${movBusca && listOverride ? ' · filtro: "'+movBusca+'"' : ''} · ${moves.length} lançamento(s)`;
    const doc = pdfNewDoc('Mata Chica Polo Club — Movimentação Geral', subtitle);
    const headers = ['Data','Tipo','Produto','Qtd.','Motivo'];
    const widths = [28,18,44,20,70];
    const rows = moves.map(m=>{
      const p = findProduct(m.productId);
      return [fmtDate(m.date), m.type==='entrada'?'Entrada':'Saída', p?p.name:'(produto removido)', `${m.qty} ${p?p.unit:''}`, m.reason||''];
    });
    if(rows.length===0){
      doc.setFont('helvetica','normal'); doc.setFontSize(10);
      doc.text('Nenhuma movimentação registrada.', PDF_MARGIN, doc._y);
    } else {
      pdfTable(doc, headers, widths, rows);
    }
    exportPdf(doc, `mata-chica-movimentacao-${stamp}.pdf`);

  } else if(type==='manejos'){
    const list = listOverride || data.manejos.slice().sort((a,b)=> new Date(b.date) - new Date(a.date));
    const subtitle = `Gerado em ${fmtDate(new Date().toISOString())}${histSearch && listOverride ? ' · filtro: "'+histSearch+'"' : ''} · ${list.length} manejo(s)`;
    const doc = pdfNewDoc('Mata Chica Polo Club — Manejos Realizados', subtitle);
    if(list.length===0){
      doc.setFont('helvetica','normal'); doc.setFontSize(10);
      doc.text('Nenhum manejo encontrado.', PDF_MARGIN, doc._y);
    } else {
      list.forEach(m=>{
        const tipoLabel = m.tipo==='implemento' ? 'Implemento' : 'Campo';
        pdfSectionTitle(doc, `[${tipoLabel}] ${m.local} — ${fmtDateOnly(m.date)}`);
        pdfParagraph(doc, m.descricao || '(sem descrição)');
        const rows = (m.itens||[]).map(it=>{
          const p = findProduct(it.productId);
          return [p?p.name:'(produto removido)', `${it.qty} ${p?p.unit:''}`];
        });
        pdfTable(doc, ['Produto','Qtd. utilizada'], [130,50], rows);
      });
    }
    exportPdf(doc, `mata-chica-manejos-${stamp}.pdf`);

  } else if(type==='personalizado'){
    const selected = data.products.filter(p=>relSelecionados.has(p.id));
    const doc = buildStockDoc(selected, 'Mata Chica Polo Club — Relatório Personalizado');
    exportPdf(doc, `mata-chica-relatorio-${stamp}.pdf`);

  } else if(type==='pedido'){
    const itens = [...relSelecionados]
      .map(id=>({product: findProduct(id), qtd: relPedidoQtd[id]}))
      .filter(it=> it.product && parseFloat(it.qtd)>0)
      .sort((a,b)=>a.product.name.localeCompare(b.product.name));

    const subtitle = `Mata Chica Polo Club · Data: ${fmtDateOnly(new Date().toISOString())} · ${itens.length} item(ns)`;
    const doc = pdfNewDoc('Mata Chica Polo Club — Pedido de Compra', subtitle);

    if(relPedidoObs.trim()){
      pdfSectionTitle(doc, 'Observações');
      pdfParagraph(doc, relPedidoObs.trim());
    }

    if(itens.length===0){
      doc.setFont('helvetica','normal'); doc.setFontSize(10);
      doc.text('Nenhum item com quantidade preenchida.', PDF_MARGIN, doc._y);
    } else {
      const cats = {};
      itens.forEach(it=>{ (cats[it.product.category] = cats[it.product.category]||[]).push(it); });
      const headers = ['Produto','Estoque atual','Unid.','Qtd. a pedir'];
      const widths = [80,32,20,48];
      for(const cat in cats){
        pdfSectionTitle(doc, cat);
        const rows = cats[cat].map(it=> [it.product.name, String(it.product.qty), it.product.unit, String(it.qtd)]);
        pdfTable(doc, headers, widths, rows);
      }
    }
    exportPdf(doc, `mata-chica-pedido-${stamp}.pdf`);
    if(itens.length>0){
      const resumo = itens.map(it=> `${it.product.name} (${it.qtd} ${it.product.unit})`).join(', ');
      logAudit('pedido_gerado', `${itens.length} item(ns): ${resumo}${relPedidoObs.trim() ? ' — Obs: '+relPedidoObs.trim() : ''}`);
    }
  }
}

// ---------- BACKUP: EXPORTAR / IMPORTAR ----------
async function exportarBackup(){
  const payload = {
    exportedAt: new Date().toISOString(),
    club: 'Mata Chica Polo Club',
    products: data.products,
    movements: data.movements,
    manejos: data.manejos
  };
  const json = JSON.stringify(payload, null, 2);
  const stamp = new Date().toISOString().slice(0,10);
  try{
    const blob = new Blob([json], {type:'application/json'});
    downloadBlob(blob, `mata-chica-estoque-backup-${stamp}.json`);
    showToast('Backup salvo.', 'ok');
  }catch(e){
    console.error(e);
    showToast('Não foi possível salvar o backup.', 'err');
  }
}

async function importarBackupArquivo(file){
  try{
    const texto = await file.text();
    const imported = JSON.parse(texto);

    if(!imported || (!Array.isArray(imported.products) && !Array.isArray(imported.manejos) && !Array.isArray(imported.movements))){
      showToast('Arquivo de backup inválido: não encontrei produtos, movimentações ou manejos nele.', 'err');
      return;
    }

    const novosProdutos = [], novasMovs = [], novosManejos = [];

    if(Array.isArray(imported.products)){
      imported.products.forEach(p=>{
        if(p && p.id && !data.products.find(x=>x.id===p.id)){
          const clean = {id:p.id, name:p.name||'', category:p.category||'Outros', unit:p.unit||'un', qty:Number(p.qty)||0, min:Number(p.min)||0, obs:typeof p.obs==='string'?p.obs:''};
          data.products.push(clean);
          novosProdutos.push(clean);
        }
      });
    }
    if(Array.isArray(imported.movements)){
      imported.movements.forEach(m=>{
        if(m && m.id && !data.movements.find(x=>x.id===m.id)){
          data.movements.push(m);
          novasMovs.push(m);
        }
      });
    }
    if(Array.isArray(imported.manejos)){
      imported.manejos.forEach(mj=>{
        if(mj && mj.id && !data.manejos.find(x=>x.id===mj.id)){
          data.manejos.push(mj);
          novosManejos.push(mj);
        }
      });
    }

    render();
    await Promise.all([
      ...novosProdutos.map(persistProduct),
      ...novasMovs.map(persistMovement),
      ...novosManejos.map(persistManejo)
    ]);

    showToast(`Backup importado sem apagar nada: ${novosProdutos.length} produto(s), ${novasMovs.length} movimentação(ões), ${novosManejos.length} manejo(s) adicionados.`, 'ok');
    logAudit('backup_importado', `${novosProdutos.length} produto(s), ${novasMovs.length} movimentação(ões), ${novosManejos.length} manejo(s)`);
  }catch(e){
    console.error(e);
    showToast('Não foi possível ler esse arquivo de backup. Verifique se é um .json exportado por este sistema.', 'err');
  }
}

function initBackupBar(){
  document.getElementById('btn-exportar-backup').onclick = exportarBackup;
  const inputFile = document.getElementById('input-importar-backup');
  document.getElementById('btn-importar-backup').onclick = ()=> inputFile.click();
  inputFile.onchange = ()=>{
    if(inputFile.files && inputFile.files[0]){
      importarBackupArquivo(inputFile.files[0]);
    }
    inputFile.value = '';
  };
}

initBackupBar();
render();
initApp();
</script>
